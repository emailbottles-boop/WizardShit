<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check out what Finn Pearson made | Wiz@rd Shit</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Check out what Finn Pearson made">
<meta property="og:description" content="WIZARD SHIT INTRO — OUT NOW">
<meta property="og:image" content="https://wizardshit.store/og-card.png">
<meta property="og:site_name" content="Wizard Shit">
<meta name="description" content="Wizard Shit is an independent animated wizard cartoon and wizard show set in Wizard City. Check out what Finn Pearson made and watch the official intro.">
<link rel="canonical" href="https://wizardshit.store/crew/finn.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Check out what Finn Pearson made">
<meta name="twitter:description" content="WIZARD SHIT INTRO — OUT NOW">
<meta name="twitter:image" content="https://wizardshit.store/og-card.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://img.youtube.com">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #0e0520;
    font-family: system-ui, sans-serif;
    color: white;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    display: flex;
    position: relative;
    min-height: 100vh;
    min-height: 100svh; /* stable height under mobile Safari's moving address bar */
  }

  /* stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 50%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 45%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 40%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* creator photo pinned in the corner */
  .corner-pic {
    position: absolute;
    top: 12px;
    right: 12px;
    top: calc(12px + env(safe-area-inset-top));
    right: calc(12px + env(safe-area-inset-right));
    width: clamp(56px, 16vw, 92px);
    height: clamp(56px, 16vw, 92px);
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid rgba(180, 80, 255, 0.55);
    box-shadow: 0 0 25px rgba(140, 40, 255, 0.5);
    z-index: 2;
  }

  .container {
    position: relative;
    z-index: 1;
    margin: auto; /* centers, but never clips the top when content is taller than the screen */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2.5rem 1.5rem;
    text-align: center;
    max-width: 700px;
  }

  .logo {
    width: min(220px, 60vw);
    filter: drop-shadow(0 0 30px rgba(180, 80, 255, 0.6));
  }

  .check-out {
    font-size: clamp(1.4rem, 5.5vw, 2.2rem);
    font-weight: 700;
    line-height: 1.3;
  }

  .check-out .name {
    color: rgb(255, 210, 60);
    text-shadow: 0 0 18px rgba(255, 190, 40, 0.6);
    white-space: nowrap;
  }

  /* the intro video lives here */
  .link-space {
    width: min(420px, 90vw);
    min-height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed rgba(180, 80, 255, 0.45);
    border-radius: 14px;
    padding: 1.2rem;
  }

  .link-space .placeholder {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255, 210, 60, 0.5);
  }

  .link-space.has-link {
    border-color: transparent;
    border-style: solid;
    padding: 0;
    min-height: 0;
  }

  /* clickable intro thumbnail */
  .watch-thumb {
    display: block;
    position: relative;
    width: min(420px, 90vw);
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid rgba(255, 210, 60, 0.55);
    box-shadow: 0 0 45px rgba(255, 190, 40, 0.3);
    transition: transform 0.15s ease;
  }

  .watch-thumb:hover { transform: scale(1.03); }

  .watch-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .watch-thumb .play {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(14, 5, 32, 0.72);
    border: 2px solid rgba(255, 210, 60, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgb(255, 210, 60);
    font-size: 1.4rem;
    padding-left: 5px; /* optically center the triangle */
    text-shadow: 0 0 10px rgba(255, 190, 40, 0.6);
  }

  /* fallback if a future link isn't a youtube url */
  .watch-btn {
    display: inline-block;
    background: linear-gradient(160deg, rgb(255, 210, 60) 0%, rgb(255, 170, 30) 100%);
    color: #2a0550;
    font-size: clamp(1.1rem, 4.5vw, 1.5rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 1.1rem 2.2rem;
    border-radius: 14px;
    box-shadow: 0 0 45px rgba(255, 190, 40, 0.55);
    transition: transform 0.15s ease;
  }

  .watch-btn:hover { transform: scale(1.05); }

  .drop-banner {
    font-size: clamp(1.6rem, 7vw, 2.8rem);
    font-weight: 900;
    line-height: 1.25;
    text-transform: none;
    color: rgb(255, 210, 60);
    text-shadow:
      0 0 25px rgba(255, 190, 40, 0.7),
      0 2px 4px rgba(0, 0, 0, 0.4);
    margin-top: 1rem;
  }

  /* phone layout: clear the corner photo, tighten spacing */
  @media (max-width: 480px) {
    .container {
      padding: 5.5rem 1.2rem 2.2rem;
      gap: 1.6rem;
    }
    .logo { width: min(180px, 52vw); }
    .drop-banner { font-size: clamp(1.45rem, 7.5vw, 2rem); }
  }
</style>
</head>
<body>

<div class="corner-pic" style="background-image: url('/Infinnity.jpg'); background-size: cover; background-position: center;" role="img" aria-label="Finn Pearson"></div>

<div class="container">
  <img src="/wizshtlogo_trans.png" class="logo" alt="Wiz@rdShit Logo">

  <h1 class="check-out">Check out what <span class="name">Finn Pearson</span> made.</h1>

  <!-- The intro thumbnail appears here, linked to the video. The link
       comes from /js/show-link.js — paste it ONCE there and every crew
       page updates. -->
  <div class="link-space" id="linkSpace">
    <span class="placeholder">YouTube link coming soon</span>
  </div>

  <div class="drop-banner">WIZARD SHIT INTRO DROPPING JUNE 10th at 4:20 EST</div>
</div>

<script src="/js/show-link.js"></script>
<script>
  (function () {
    var space = document.getElementById('linkSpace');
    var url = (window.WIZARD_SHIT_YOUTUBE_LINK || '').trim();
    if (!url) return; // no link yet: keep the "coming soon" box
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    space.classList.add('has-link');
    space.innerHTML = '';
    var a = document.createElement('a');
    a.href = url;

    var m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{6,20})/);
    if (m) {
      // youtube link: show the real video thumbnail
      var id = m[1];
      a.className = 'watch-thumb';
      a.setAttribute('aria-label', 'Watch the Wizard Shit intro');
      var img = document.createElement('img');
      img.src = 'https://img.youtube.com/vi/' + id + '/maxresdefault.jpg';
      img.alt = 'Wizard Shit Intro';
      img.onerror = function () {
        if (!this.dataset.fb) { this.dataset.fb = 1; this.src = 'https://img.youtube.com/vi/' + id + '/sddefault.jpg'; }
        else { this.onerror = null; this.src = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg'; }
      };
      a.appendChild(img);
      var play = document.createElement('span');
      play.className = 'play';
      play.textContent = '\u25B6';
      a.appendChild(play);
    } else {
      // not a youtube url: fall back to the button
      a.className = 'watch-btn';
      a.textContent = '\u25B6 WATCH THE INTRO';
    }
    space.appendChild(a);
  })();
</script>
</body>
</html>
