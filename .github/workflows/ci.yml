# Every pull request and every push to main must pass this before it can be
# trusted. Two halves: the Worker's money-path tests (vitest) and the browser
# batteries that drive the real storefront in Chromium against a stubbed API.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx vitest run
  storefront:
    name: Storefront browser batteries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: storefront-screenshots, path: test/browser/out, if-no-files-found: ignore }
