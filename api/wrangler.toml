# Wizard Shit backend — Cloudflare Worker
# Deploy with: npx wrangler deploy   (from the api/ directory)
# Full setup steps: see api/README.md

name = "wizardshit-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Keep the wizardshit-api.wizardshit-api.workers.dev URL alive alongside the
# custom-domain routes below. Adding routes silently disables it otherwise,
# which would break the direct admin link and leave no way in if the domain
# or its DNS ever has a bad day.
workers_dev = true

# Routes on the custom domain. GitHub Pages keeps serving everything else.
#
# NEVER add a bare "wizardshit.store/" or "wizardshit.store/*" route here:
# the worker redirects "/" to /login, so that would bounce the homepage to
# the login screen. These patterns are deliberately narrow.
#
# The trailing * on /login and /admin is load-bearing: an exact pattern matches
# the path only, so "/login?anything" missed the worker and fell through to
# GitHub Pages. It also covers the trailing-slash form, which the worker
# redirects itself.
routes = [
  { pattern = "wizardshit.store/login*", zone_name = "wizardshit.store" },
  { pattern = "wizardshit.store/admin*", zone_name = "wizardshit.store" },
  { pattern = "wizardshit.store/api/*",  zone_name = "wizardshit.store" },
  { pattern = "wizardshit.store/img/*",  zone_name = "wizardshit.store" },
]

# D1 database — create it with:
#   npx wrangler d1 create wizardshit
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "wizardshit"
database_id = "0b069125-5227-49b6-a2b4-25a754ea4f54"

# R2 bucket for uploaded images — create it with:
#   npx wrangler r2 bucket create wizardshit-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "wizardshit-images"

[vars]
# Origins allowed to call the public API from a browser.
ALLOWED_ORIGINS = "https://wizardshit.store,https://www.wizardshit.store,https://madamwizzy.com,https://www.madamwizzy.com,http://localhost:8080,http://127.0.0.1:8080"

# --- The shop (src/shop.js): cart, checkout, donations on wizardshit.store ---
# Where Stripe sends the customer back to after paying.
SITE_URL = "https://wizardshit.store"
# When a paid order goes to print. "true" (the default): only once Stripe has
# paid that order's money out to the bank, so printing is never fronted from
# the studio's own pocket. "false": the moment the card is charged.
# Needs the Stripe webhook subscribed to payout.paid as well as the checkout events.
CONFIRM_ON_PAYOUT = "true"
# Sales tax at checkout via Stripe Tax. Leave off until a tax registration
# (e.g. Washington) has been added under Stripe → Settings → Tax, then "true".
STRIPE_TAX = "false"
# Only needed if PRINTFUL_TOKEN is an account-level token rather than a
# store-level one (the store dropdown in Printful → Settings → Developers).
# PRINTFUL_STORE_ID = "12345678"
#
# Secrets the shop needs (never in this file):
#   npx wrangler secret put PRINTFUL_TOKEN          # Printful → Settings → Developers → Add token (Products read, Orders read/write)
#   npx wrangler secret put STRIPE_SECRET_KEY       # Stripe → Developers → API keys → Secret key (sk_live_…)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # Stripe → Developers → Webhooks → the endpoint's signing secret (whsec_…)

# --- Admin auth, option A (recommended): Cloudflare Access ---
# Put an Access application in front of this worker's /admin and /api/admin
# paths, then fill these in (see README step 5).
#   ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
#   ACCESS_AUD         = "the Access application's Audience (AUD) tag"
# --- Google sign-in on the wizard login page (optional) ---
# 1) Make an OAuth Client ID at https://console.cloud.google.com/apis/credentials
#    (Web application; authorized JavaScript origin: https://wizardshit.store)
# 2) Paste the client id below. The founder email allowlist is stored as a
#    SECRET so personal emails never sit in this public repo:
#      npx wrangler secret put FOUNDER_EMAILS
#    (comma-separated, e.g.: wizardshitofficial@gmail.com,someone@else.com)
GOOGLE_CLIENT_ID = "260370337802-lur9o4i2jtplgfldo4khqs7j6lbvq7r5.apps.googleusercontent.com"

ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# --- Admin auth, option B (simpler): shared password ---
# Only used when Access is NOT configured above. Set it as a secret so it
# never lives in this file:
#   npx wrangler secret put ADMIN_PASSWORD

# NOTE: there is deliberately no [[ratelimits]] binding here. It was tried and
# removed: the binding bound fine and limit() returned {success:true} for 14
# consecutive posts from a single IP, i.e. it never enforced on this account.
# Leaving it in place would have looked like protection while providing none.
# The throttle for POST /api/messages now lives in src/index.js (allowMessage).
